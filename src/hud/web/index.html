<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Jarvis HUD</title>
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  #hud {
    width: 220px;
    height: 220px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .ring-wrap {
    position: relative;
    width: 120px;
    height: 120px;
  }

  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-bg {
    fill: none;
    stroke: rgba(120, 220, 255, 0.08);
    stroke-width: 4;
  }

  .ring-fg {
    fill: none;
    stroke: #4fd8ff;
    stroke-width: 4;
    stroke-linecap: round;
    filter: drop-shadow(0 0 6px rgba(79, 216, 255, 0.9));
    transition: stroke 0.35s ease, stroke-dasharray 0.35s ease;
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 54px;
    height: 54px;
    margin: -27px 0 0 -27px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #7fe6ff, #0b3a4a 70%);
    box-shadow: 0 0 18px rgba(79, 216, 255, 0.55);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
  }

  #hud[data-state="idle"] .core {
    animation: idle-pulse 3.2s ease-in-out infinite;
  }
  #hud[data-state="listening"] .core {
    animation: listening-pulse 0.9s ease-in-out infinite;
    background: radial-gradient(circle at 35% 30%, #b6ffec, #0b4a3a 70%);
  }
  #hud[data-state="thinking"] .ring-fg {
    stroke: #ffb454;
    filter: drop-shadow(0 0 6px rgba(255, 180, 84, 0.9));
    animation: spin 1.1s linear infinite;
    stroke-dasharray: 40 200;
  }
  #hud[data-state="thinking"] .core {
    background: radial-gradient(circle at 35% 30%, #ffe0b0, #4a2f0b 70%);
    animation: idle-pulse 1.4s ease-in-out infinite;
  }
  #hud[data-state="speaking"] .core {
    animation: speaking-pulse 0.5s ease-in-out infinite;
    background: radial-gradient(circle at 35% 30%, #ffd9f5, #4a0b3a 70%);
  }
  #hud[data-state="speaking"] .ring-fg {
    stroke: #ff8fe0;
    filter: drop-shadow(0 0 6px rgba(255, 143, 224, 0.9));
  }

  @keyframes idle-pulse {
    0%, 100% { transform: scale(0.92); box-shadow: 0 0 14px rgba(79, 216, 255, 0.35); }
    50%      { transform: scale(1.0);  box-shadow: 0 0 22px rgba(79, 216, 255, 0.65); }
  }
  @keyframes listening-pulse {
    0%, 100% { transform: scale(0.95); }
    50%      { transform: scale(1.12); }
  }
  @keyframes speaking-pulse {
    0%, 100% { transform: scale(0.97); }
    50%      { transform: scale(1.08); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(200, 235, 255, 0.75);
  }

  .caption {
    max-width: 200px;
    max-height: 54px;
    overflow: hidden;
    text-align: center;
    font-size: 12px;
    line-height: 1.35;
    color: rgba(255, 255, 255, 0.88);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>
  <div id="hud" data-state="idle">
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
        <circle class="ring-fg" cx="60" cy="60" r="52" stroke-dasharray="220 327" stroke-dashoffset="0"></circle>
      </svg>
      <div class="core"></div>
    </div>
    <div class="label" id="label">idle</div>
    <div class="caption" id="caption"></div>
  </div>

<script>
  const hud = document.getElementById("hud");
  const label = document.getElementById("label");
  const caption = document.getElementById("caption");

  function applyState(payload) {
    const state = payload.state || "idle";
    hud.setAttribute("data-state", state);
    label.textContent = state;
    if (state === "listening") {
      caption.textContent = "";
    } else if (state === "thinking") {
      caption.textContent = payload.transcript || "";
    } else if (state === "speaking") {
      caption.textContent = payload.reply || "";
    } else {
      caption.textContent = "";
    }
  }

  function connect() {
    const ws = new WebSocket("ws://127.0.0.1:8765");
    ws.onmessage = (event) => {
      try {
        applyState(JSON.parse(event.data));
      } catch (e) { /* ignore malformed frames */ }
    };
    ws.onclose = () => setTimeout(connect, 1000);
    ws.onerror = () => ws.close();
  }
  connect();
</script>
</body>
</html>
