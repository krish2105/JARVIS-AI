wake_word: jarvis
voice: am_liam
model:
  local: mlx-community/Meta-Llama-3.1-8B-Instruct-4bit
  local_heavy: mlx-community/Qwen2.5-14B-Instruct-4bit
audio:
  sample_rate: 16000
  vad_silence_ms: 700
  max_record_seconds: 15
  wake_word_sensitivity: 0.4
  full_duplex: true
filesystem_allowlist:
- ~/Documents
- ~/Desktop
- .
require_confirmation_for:
- delete_file
- run_shell_command
- Write
- browser_action
- send_message
hud:
  host: 127.0.0.1
  port: 8765
rag:
  folders:
  - ~/Documents
  - ~/Desktop
  include_notes: true
  max_files: 800
  max_file_kb: 2048
onboarded: true
