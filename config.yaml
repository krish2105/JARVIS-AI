# Jarvis configuration. Secrets stay in .env — this file is safe to commit.

# Matched against openWakeWord's bundled model names (e.g. "jarvis" matches
# its pretrained "hey_jarvis" model). No account or key needed — see
# src/audio/wake_word.py.
wake_word: jarvis

voice: am_liam # Kokoro voice name. Try af_heart, af_bella, am_adam, bm_george, etc.

# mlx-community model repo ids, run locally via mlx-lm — free, offline,
# downloaded from Hugging Face on first use and cached thereafter. `local`
# is the everyday model (fast); `local_heavy` is used for requests that look
# like multi-step planning (see src/brain/agent.py:select_model). Swap
# `local` for something bigger (e.g. Qwen2.5-7B-Instruct-4bit) if you have
# the memory and want better quality at the cost of latency.
model:
  local: mlx-community/Llama-3.2-3B-Instruct-4bit
  local_heavy: mlx-community/Meta-Llama-3.1-8B-Instruct-4bit

audio:
  sample_rate: 16000
  vad_silence_ms: 700           # how much trailing silence ends a turn
  max_record_seconds: 15
  wake_word_sensitivity: 0.6    # openWakeWord detection threshold, 0-1

# Directories Jarvis's read_file/write_file/run_shell tools are allowed to
# touch. Never widen this to the whole home directory or root.
filesystem_allowlist:
  - "~/Documents"
  - "~/Desktop"
  - "." # the project folder itself

# Tools that must ask for explicit spoken/typed confirmation ("confirm")
# before they are allowed to execute. Hard requirement — do not remove.
require_confirmation_for:
  - delete_file
  - run_shell_command
  - Write

hud:
  host: 127.0.0.1
  port: 8765
  corner: bottom-right # top-left | top-right | bottom-left | bottom-right
