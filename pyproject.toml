[project]
name = "jarvis"
version = "0.1.0"
description = "Local, voice-first personal AI assistant for Apple Silicon Macs — fully local reasoning via MLX, no cloud API required."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # webrtcvad imports pkg_resources internally, which recent setuptools
    # releases have started dropping entirely (83.x no longer ships it).
    # Pin below that so pkg_resources actually exists in the venv.
    "setuptools<80",
    "mlx-lm",
    "mlx-whisper",
    "mlx-audio",
    "mlx-vlm",  # local vision-language model for "look at my screen"
    # misaki[en] (NOT bare misaki): Kokoro TTS needs misaki's English G2P,
    # which pulls num2words + spacy + the en_core_web_sm model. Without the
    # [en] extra, TTS raises "Kokoro requires the optional 'misaki' package"
    # at synthesis time and produces no audio.
    "misaki[en]",
    "openwakeword",
    # openWakeWord runs its models through onnxruntime. onnxruntime 1.27.x
    # SILENTLY produces all-zero scores for openWakeWord's models — the wake
    # word never fires no matter what you say. 1.20.1 works correctly (verified:
    # "Hey Jarvis" scores ~0.95). Pin to a known-good, numpy-2-compatible range.
    "onnxruntime>=1.19.2,<1.21",
    "sounddevice",
    "webrtcvad",
    # numpy window: >=2.0 because scipy (via scikit-learn, an openWakeWord dep)
    # uses np.long, which only exists in numpy 2.0+; <2.5 because numba (pulled
    # in transitively) requires NumPy 2.4 or less.
    "numpy>=2.0,<2.5",
    "requests",
    "pyyaml",
    "python-dotenv",
    "rumps",
    "pywebview",
    "websockets",
    "pynput",  # global ⌥Space hotkey for the command bar
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "bandit",
    "pip-audit",
]
# Official MCP SDK — the intended replacement for the hand-rolled stdio client
# in src/brain/mcp_client.py. Requires Python 3.10+, so it is an opt-in extra
# rather than a hard dependency (the project still supports the 3.12 target).
mcp = ["mcp>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
# S603/S607: subprocess use is intentional and guarded (see tools.py run_shell
# allowlist + shell=False, and mcp_client stdio transport).
# S110: try/except/pass in the logging filter is deliberate (logging must
# never raise). UP is omitted so the code stays runnable on the 3.9 CI lane
# used for hardware-independent tests as well as the 3.12 target.
ignore = ["S603", "S607", "S110"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately touch private helpers, use assert, and have long
# monkeypatch/fixture lines.
"tests/*" = ["S101", "S105", "S106", "E501"]
# Type-narrowing asserts on Popen stdio pipes, not test assertions.
"src/brain/mcp_client.py" = ["S101"]

[tool.bandit]
# B404/B603/B607: run_shell is hardened (allowlist + shell=False) and the MCP
#   client's stdio transport is a trusted local child process.
# B101: the two asserts in mcp_client.py narrow Popen stdio pipe types; not
#   test/security assertions.
# B110: the try/except/pass in redaction.py is deliberate — logging must never
#   raise.
skips = ["B404", "B603", "B607", "B101", "B110"]
