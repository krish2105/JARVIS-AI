[project]
name = "jarvis"
version = "0.1.0"
description = "Local, voice-first personal AI assistant for Apple Silicon Macs — fully local reasoning via MLX, no cloud API required."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "setuptools", # provides pkg_resources, which webrtcvad imports internally;
                  # not bundled by pip/venv automatically on newer Python 3.12
    "mlx-lm",
    "mlx-whisper",
    "mlx-audio",
    "misaki",
    "openwakeword",
    "sounddevice",
    "webrtcvad",
    "numpy",
    "requests",
    "pyyaml",
    "python-dotenv",
    "rumps",
    "pywebview",
    "websockets",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
